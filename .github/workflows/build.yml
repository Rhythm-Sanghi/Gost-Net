name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Initialize git repository for build metadata
      run: |
        git config --global user.email "build@ghostnet.local"
        git config --global user.name "Ghost Net Builder"
       
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          g++ \
          cmake \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          libffi-dev \
          libssl-dev \
          python3-dev \
          python3-pip \
          ant \
          ccache
          
    - name: Install Rust toolchain for Android cross-compilation
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
        
    - name: Set Java options (prevent OOM errors)
      run: |
        echo "_JAVA_OPTIONS=-Xms512m -Xmx2048m" >> $GITHUB_ENV
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Setup Android SDK Path permissions
      run: |
        sudo mkdir -p /usr/local/lib/android/sdk/ndk
        sudo chown -R runner:runner /usr/local/lib/android/sdk

    - name: Cache Android NDK
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/android/sdk/ndk/25.1.8937393
        key: ${{ runner.os }}-ndk-25.1.8937393

    - name: Download and extract Android NDK r25b
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: |
        if [ ! -f /tmp/android-ndk-r25b-linux.zip ]; then
          cd /tmp
          wget --quiet https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        fi
        unzip -q /tmp/android-ndk-r25b-linux.zip -d /tmp
        mv /tmp/android-ndk-r25b /usr/local/lib/android/sdk/ndk/25.1.8937393

    - name: Setup Android SDK Path for Buildozer
      run: |
        sudo chown -R runner:runner /usr/local/lib/android/sdk
        ln -sfn /usr/local/lib/android/sdk/cmdline-tools/latest /usr/local/lib/android/sdk/tools
        yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses || true
        yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platforms;android-33" "build-tools;33.0.2"
        
    - name: Cache Buildozer directory
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Cache Pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('buildozer.spec', 'requirements.txt') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ hashFiles('buildozer.spec', 'requirements.txt') }}-
          ${{ runner.os }}-ccache-

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer
        pip install --upgrade cython==0.29.33
        pip install -r requirements.txt
        
    - name: Configure Cython for Python 3 compatibility
      run: |
        mkdir -p ~/.cython
        cat > ~/.cython/cythonrc << 'EOF'
        [build_ext]
        compiler_directives = {"language_level": "3"}
        EOF
        
    - name: Configure python-for-android for Cython Python 3
      run: |
        mkdir -p ~/.buildozer/android/platform/build-tools
        cat > ~/.buildozer/cython_directives.txt << 'EOF'
        language_level=3
        EOF
    - name: Check for release secrets
      id: check_secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "has_secrets=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Decode and setup keystore (Release only)
      if: steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ghostnet.keystore
        
    - name: Build debug APK
      if: steps.check_secrets.outputs.has_secrets == 'false'
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROIDSDK: /usr/local/lib/android/sdk
        ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROIDAPI: 33
        ANDROIDMINAPI: 21
        MAKEFLAGS: -j2
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: 1G
      run: |
        buildozer -v android debug > buildozer.log 2>&1 || (tail -n 2000 buildozer.log && exit 1)
        
    - name: Build release APK
      if: steps.check_secrets.outputs.has_secrets == 'true'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROIDSDK: /usr/local/lib/android/sdk
        ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.1.8937393
        ANDROIDAPI: 33
        ANDROIDMINAPI: 21
        MAKEFLAGS: -j2
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: 1G
      run: |
        buildozer -v android release > buildozer.log 2>&1 || (tail -n 2000 buildozer.log && exit 1)
        
    - name: Sign release APK
      if: steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
        SIGNED_APK_PATH="${APK_PATH%-unsigned.apk}-signed.apk"
        
        $ANDROID_HOME/build-tools/*/apksigner sign \
          --ks ghostnet.keystore \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --out "$SIGNED_APK_PATH" \
          "$APK_PATH"
          
        $ANDROID_HOME/build-tools/*/apksigner verify "$SIGNED_APK_PATH"
        
        echo "Signed APK: $SIGNED_APK_PATH"
        
    - name: Get APK filename
      id: apk_name
      run: |
        if [ "${{ steps.check_secrets.outputs.has_secrets }}" == "true" ]; then
          APK_PATH=$(find bin -name "*-signed.apk" -type f | head -n 1)
        else
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ghostnet-apk-${{ github.run_number }}
        path: ${{ steps.apk_name.outputs.apk_path }}
        retention-days: 30

    - name: Upload Buildozer log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log-${{ github.run_number }}
        path: buildozer.log
        retention-days: 7
        if-no-files-found: ignore
        
    - name: Generate build report
      if: always()
      run: |
        echo "## 📱 Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** ${{ steps.check_secrets.outputs.has_secrets == 'true' && 'Release (Signed)' || 'Debug' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "${{ steps.apk_name.outputs.apk_path }}" ]; then
          APK_SIZE=$(du -h "${{ steps.apk_name.outputs.apk_path }}" | cut -f1)
          echo "**APK Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**APK Name:** ${{ steps.apk_name.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Build failed!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the build logs for errors." >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request' && steps.apk_name.outputs.apk_path != ''
      uses: actions/github-script@v7
      with:
        script: |
          const apkName = '${{ steps.apk_name.outputs.apk_name }}';
          const buildType = '${{ steps.check_secrets.outputs.has_secrets == 'true' && 'Release (Signed)' || 'Debug' }}';
          const runNumber = '${{ github.run_number }}';
          
          const body = `## 📱 APK Build Complete
          
          **Build Type:** ${buildType}
          **APK:** \`${apkName}\`
          **Run:** [#${runNumber}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          Download the APK from the **Artifacts** section of the workflow run.
          
          ---
          
          🤖 *Automated by GitHub Actions*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
