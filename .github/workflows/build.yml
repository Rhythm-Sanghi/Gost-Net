name: CI — Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      clean_native:
        description: "Discard any cached native (p4a/NDK) build state and rebuild every native dependency from source"
        type: boolean
        default: true

jobs:
  # ─── Test Suite ───────────────────────────────────────────────────────────────
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies (headless Kivy)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libcairo2-dev \
          pkg-config \
          python3-dev \
          xvfb

    - name: Install Python test dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-timeout

    - name: Python compile check (all production source files)
      run: |
        python -m compileall -q src/ main.py service.py

    - name: Run unit and integration tests (headless)
      env:
        GOSTNET_TEST_MODE: "1"
        DISPLAY: ":99"
      run: |
        set -o pipefail
        Xvfb :99 -screen 0 1024x768x24 &
        python -m pytest tests/ \
          --tb=short \
          -q \
          --asyncio-mode=auto \
          --timeout=120 \
          -x \
          2>&1 | tee test_output.txt

    # The release verifier is a mandatory gate in its own right: it re-checks
    # packaging spec sanity, research isolation, release-secret scanning and
    # re-runs the core suite. It runs before any APK is produced.
    - name: Release qualification verifier
      env:
        GOSTNET_TEST_MODE: "1"
        DISPLAY: ":99"
      run: |
        set -o pipefail
        python scripts/verify_release.py 2>&1 | tee verify_release_output.txt

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_number }}
        path: test_output.txt
        retention-days: 14
        if-no-files-found: ignore

  # ─── Android APK Build (Track A — Sideload / API 36 / NDK r28b / 16 KB pages) ──
  build:
    name: Android APK Build (Track A — Sideload)
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git for build metadata
      run: |
        git config --global user.email "build@gostnet.local"
        git config --global user.name "Gost-Net Builder"

    # ── Python 3.11 to match p4a hostpython3==3.11.9 recipe ──
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          patchelf \
          g++ \
          cmake \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          libcairo2-dev \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          libffi-dev \
          libssl-dev \
          python3-dev \
          python3-pip \
          ant \
          ccache

    # ── Rust is required by the `cryptography` p4a recipe ──
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # ── Ensure ~/.cargo/bin is on PATH for all subsequent steps ──
    - name: Add Cargo bin to PATH
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Verify Rust toolchain
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup --version
        cargo --version
        rustup target list --installed | grep aarch64-linux-android

    - name: Set Java and build options
      run: |
        echo "_JAVA_OPTIONS=-Xms512m -Xmx2048m" >> $GITHUB_ENV
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    # ── Android SDK — use the pre-installed SDK on ubuntu-latest ──
    - name: Configure Android SDK
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        sudo chown -R runner:runner "$SDK_ROOT" || true
        yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
        "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
          "platforms;android-36" \
          "platforms;android-33" \
          "build-tools;35.0.0" || true

    # pip cache first, then the build dependencies themselves: the step below
    # (Resolve native toolchain identity) reads the installed python-for-android
    # version in order to build the native cache key, so p4a has to exist before
    # it runs.
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python build dependencies
      run: |
        set -euo pipefail
        pip install --upgrade pip
        # Pin buildozer for the same reason p4a is pinned in the spec: an
        # unpinned `--upgrade buildozer` means the driver that generates the
        # gradle project, the manifest and the p4a invocation can change
        # between runs, so the native stack is not reproducible from the
        # repository. 1.6.0 is the version the qualified APK was built with.
        pip install --upgrade "buildozer==1.6.0"
        pip install --upgrade "cython==0.29.33"
        pip install -r requirements.txt
        # Fail loudly if a pin silently fails to take effect, rather than
        # building with whatever version happened to be resolved.
        BZ_VER=$(python3 -m pip show buildozer | awk -F': ' '/^Version:/{print $2}')
        if [ "$BZ_VER" != "1.6.0" ]; then
          echo "::error title=Pin mismatch::buildozer is pinned to 1.6.0 but resolved to ${BZ_VER}"
          exit 1
        fi
        echo "buildozer pin verified: $BZ_VER"

    # Resolve the exact toolchain identity BEFORE any native cache is restored,
    # so the cache key can be bound to it. Two things make that necessary:
    #
    #   * the NDK revision, because r25b and r28b produce different LOAD
    #     alignment from identical sources, so an r25-era cache entry must
    #     never satisfy an r28 build;
    #   * the python-for-android revision, because buildozer does NOT install
    #     p4a from PyPI. It git-clones kivy/python-for-android -b master into
    #     the platform dir and runs `python -m pythonforandroid.toolchain`
    #     with that directory on sys.path. Asking pip for its version measures
    #     a different, unrelated installation, so the revision is read from
    #     the p4a.commit pin in the build spec instead.
    #
    # This step never fails the job: it only reports identity. If it cannot
    # determine something, the cache key degrades to a coarser discriminator
    # rather than blocking the build, because the mandatory gate is
    # scripts/check_android_16kb.py, not this bookkeeping.
    - name: Resolve native toolchain identity
      id: toolchain
      run: |
        set -uo pipefail
        NDK_REV=28.1.13356709
        BUILD0ZER_VER=$(python3 -m pip show buildozer 2>/dev/null \
                        | awk -F': ' '/^Version:/{print $2}' || true)
        # The spec is the source of truth: it is what pins the revision.
        P4A_COMMIT=$(grep -E '^p4a\.commit' buildozer.spec | head -1 \
                     | cut -d= -f2 | tr -d '[:space:]' || true)
        if [ -z "$P4A_COMMIT" ] || [ "$P4A_COMMIT" = "HEAD" ]; then
          echo "::warning title=Unpinned python-for-android::buildozer.spec does not pin p4a.commit; the native stack is not reproducible and the cache key cannot discriminate p4a revisions."
          P4A_COMMIT="UNPINNED-$(date -u +%Y%m%d%H%M)"
        fi
        echo "ndk_rev=$NDK_REV"                        >> $GITHUB_OUTPUT
        echo "p4a_commit=${P4A_COMMIT:0:12}"           >> $GITHUB_OUTPUT
        echo "buildozer_version=${BUILD0ZER_VER:-unknown}" >> $GITHUB_OUTPUT
        {
          echo "### native build identity ###"
          echo "| item | value |"
          echo "| --- | --- |"
          echo "| NDK | r${NDK_REV} |"
          echo "| python-for-android | \`${P4A_COMMIT}\` (from p4a.commit) |"
          echo "| buildozer | ${BUILD0ZER_VER:-unknown} |"
          echo "| target API / min | 36 / 21 |"
          echo "| arch | arm64-v8a |"
        } >> $GITHUB_STEP_SUMMARY

    - name: Cache Android NDK r28b
      id: cache-ndk
      uses: actions/cache@v4
      with:
        path: /home/runner/.buildozer/android/platform/android-ndk-r28b
        key: ${{ runner.os }}-ndk-r28b-${{ steps.toolchain.outputs.ndk_rev }}

    - name: Download Android NDK r28b
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$HOME/.buildozer/android/platform"
        if [ ! -d "$HOME/.buildozer/android/platform/android-ndk-r28b" ]; then
          echo "Downloading Android NDK r28b..."
          wget --quiet -O /tmp/android-ndk-r28b-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q /tmp/android-ndk-r28b-linux.zip -d "$HOME/.buildozer/android/platform"
          echo "NDK extracted successfully."
        else
          echo "NDK r28b already present."
        fi

    - name: Set NDK environment variables
      run: |
        NDK_PATH="$HOME/.buildozer/android/platform/android-ndk-r28b"
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROIDSDK=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROIDAPI=36" >> $GITHUB_ENV
        echo "ANDROIDMINAPI=21" >> $GITHUB_ENV

    # The native cache key is bound to the full build identity required by the
    # qualification: runner OS, NDK revision, python-for-android build, target
    # and min API, the spec, the requirements and the custom recipe directory
    # (which includes the local Kivy recipe and its vendored patches).
    #
    # There is deliberately NO restore-keys fallback. A key miss must mean a
    # genuinely clean native build, never a partially-stale p4a distribution:
    # the Kivy recipe defect in this release was invisible locally for exactly
    # as long as a cached native build kept satisfying it.
    - name: Cache Buildozer platform directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer/android/platform/build-arm64-v8a
        key: ${{ runner.os }}-${{ runner.arch }}-native-api36-min21-arm64-v8a-ndk${{ steps.toolchain.outputs.ndk_rev }}-p4a${{ steps.toolchain.outputs.p4a_commit }}-bz${{ steps.toolchain.outputs.buildozer_version }}-spec${{ hashFiles('buildozer-sideload.spec') }}-req${{ hashFiles('requirements.txt') }}-recipes${{ hashFiles('p4a_recipes/**') }}

    # Explicit, auditable clean-native switch. The hosted runner is already a
    # fresh VM, so this only removes anything the cache step above restored.
    # Set clean_native=true on the first qualification run to prove that a
    # clean checkout plus the new Kivy recipe plus NDK r28 yields a working APK.
    #
    # ccache is deliberately NOT cleared: it is content-addressed on the
    # preprocessor command line, which embeds the NDK compiler path and the
    # driver-injected -z max-page-size, so an r25-era object can never satisfy
    # an r28 compile. It is restored immediately below regardless.
    - name: Clean native build state
      if: ${{ inputs.clean_native != false }}
      run: |
        set -euo pipefail
        echo "### removing any restored native build state ###"
        rm -rf ~/.buildozer/android/platform/build-arm64-v8a
        mkdir -p ~/.buildozer/android/platform
        echo "clean native state: $(ls -A ~/.buildozer/android/platform 2>/dev/null | tr '\n' ' ' || echo empty)"

    # ccache is restored after the clean step so it is available to the build.
    # It is safe to share across NDK revisions because it is content-addressed on
    # the preprocessor command line, which embeds both the compiler path and the
    # driver-injected -z max-page-size.
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-ndk${{ steps.toolchain.outputs.ndk_rev }}-p4a${{ steps.toolchain.outputs.p4a_commit }}-bz${{ steps.toolchain.outputs.buildozer_version }}-${{ hashFiles('buildozer-sideload.spec', 'requirements.txt', 'p4a_recipes/**') }}
        restore-keys: |
          ${{ runner.os }}-ccache-ndk${{ steps.toolchain.outputs.ndk_rev }}-p4a${{ steps.toolchain.outputs.p4a_commit }}-bz${{ steps.toolchain.outputs.buildozer_version }}-

    # ── Use the validated sideload spec (Track A) ──
    - name: Select Track A (sideload) build spec
      run: |
        cp buildozer-sideload.spec buildozer.spec
        echo "Active buildozer.spec contents:"
        head -30 buildozer.spec

    # ── Check for signing secrets ──
    - name: Check for release signing secrets
      id: check_secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
           [ -n "${{ secrets.KEY_ALIAS }}" ] && \
           [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "has_secrets=false" >> $GITHUB_OUTPUT
        fi

    - name: Decode keystore (release only)
      if: steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ghostnet.keystore

    # ── Main build step ──
    - name: Build debug APK (Track A)
      if: steps.check_secrets.outputs.has_secrets == 'false'
      env:
        CARGO_HOME: /home/runner/.cargo
        RUSTUP_HOME: /home/runner/.rustup
        ANDROIDSDK: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r28b
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r28b
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r28b
        ANDROIDAPI: 36
        ANDROIDMINAPI: 21
        MAKEFLAGS: -j2
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: 1G
      run: |
        set -o pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup --version
        cargo --version
        buildozer -v android debug 2>&1 | tee buildozer.log

    - name: Build release APK (Track A, signed)
      if: steps.check_secrets.outputs.has_secrets == 'true'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        CARGO_HOME: /home/runner/.cargo
        RUSTUP_HOME: /home/runner/.rustup
        ANDROIDSDK: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r28b
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r28b
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r28b
        ANDROIDAPI: 36
        ANDROIDMINAPI: 21
        MAKEFLAGS: -j2
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: 1G
      run: |
        set -o pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup --version
        cargo --version
        buildozer -v android release 2>&1 | tee buildozer.log

    - name: Sign release APK
      if: steps.check_secrets.outputs.has_secrets == 'true'
      run: |
        APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
        SIGNED_APK_PATH="${APK_PATH%-unsigned.apk}-signed.apk"
        BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/35.*/ 2>/dev/null | sort -V | tail -1)
        if [ -z "$BUILD_TOOLS" ]; then
          echo "ERROR: no build-tools 35+ found; 16 KB zipalign requires it"
          exit 1
        fi
        SIGNER="${BUILD_TOOLS}apksigner"
        "$SIGNER" sign \
          --ks ghostnet.keystore \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --out "$SIGNED_APK_PATH" \
          "$APK_PATH"
        "$SIGNER" verify "$SIGNED_APK_PATH"
        echo "Signed APK: $SIGNED_APK_PATH"

    - name: Locate APK
      id: apk_name
      run: |
        if [ "${{ steps.check_secrets.outputs.has_secrets }}" == "true" ]; then
          APK_PATH=$(find bin -name "*-signed.apk" -type f | head -n 1)
        else
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
        echo "APK located: $APK_PATH"
        ls -lh "$APK_PATH"

    # ── RELEASE GATE: 16 KB page size ──────────────────────────────────────
    # Must run BEFORE artifact upload so a non-compliant APK can never be
    # published. Fails if ANY packaged arm64-v8a native library has a PT_LOAD
    # alignment below 2**14 (16384), or if APK ZIP alignment is wrong.
    - name: Audit APK for 16 KB page-size compliance
      id: audit_16kb
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        echo "Auditing: ${{ steps.apk_name.outputs.apk_path }}"
        # Publish the hash of the exact bytes being audited, so the downloaded
        # artifact can be verified against it without trusting this workflow.
        sha256sum "${{ steps.apk_name.outputs.apk_path }}" | tee apk.sha256
        python3 scripts/check_android_16kb.py "${{ steps.apk_name.outputs.apk_path }}" \
          | tee 16kb-audit.log

    # ── Upload APK artifact ───────────────────────────────────────────────
    # No `if: always()`: a failed audit gate must stop the APK from being
    # published at all. The name is deliberately neutral and run-unique --
    # an artifact is a CI output, not a release candidate, so it must not
    # claim "rc2" before that tag actually exists.
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: gost-net-android-ci-${{ github.run_number }}
        path: ${{ steps.apk_name.outputs.apk_path }}
        retention-days: 30

    - name: Upload 16 KB audit log and APK SHA-256
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: 16kb-audit-${{ github.run_number }}
        path: |
          16kb-audit.log
          apk.sha256
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Buildozer log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log-${{ github.run_number }}
        path: buildozer.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Compute APK SHA-256
      if: always()
      run: |
        if [ -f "${{ steps.apk_name.outputs.apk_path }}" ]; then
          sha256sum "${{ steps.apk_name.outputs.apk_path }}"
        else
          echo "APK not found — build may have failed"
        fi

    - name: Build summary
      if: always()
      run: |
        echo "## 📱 Gost-Net Android Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| **Build Type** | ${{ steps.check_secrets.outputs.has_secrets == 'true' && 'Release (Signed)' || 'Debug' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Run** | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Track** | A — Sideload (API 36 / NDK r28b / 16 KB pages) |" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.audit_16kb.outcome }}" = "success" ]; then
          echo "| **16 KB Gate** | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ steps.audit_16kb.outcome }}" = "failure" ]; then
          echo "| **16 KB Gate** | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| **16 KB Gate** | ⏭ not run |" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "${{ steps.apk_name.outputs.apk_path }}" ]; then
          APK_SIZE=$(du -h "${{ steps.apk_name.outputs.apk_path }}" | cut -f1)
          echo "| **APK** | ${{ steps.apk_name.outputs.apk_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        # The APK is only ever uploaded when the 16 KB gate passed, so the
        # summary must key off the gate, not off mere file presence on disk.
        if [ "${{ steps.audit_16kb.outcome }}" = "success" ]; then
          echo "✅ **Build successful — 16 KB gate passed, artifact: \`gost-net-android-ci-${{ github.run_number }}\`**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **APK SHA-256** | \`$(cut -d' ' -f1 apk.sha256 2>/dev/null || echo unavailable)\` |" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ steps.audit_16kb.outcome }}" = "failure" ]; then
          echo "🛑 **16 KB page-size gate FAILED — APK deliberately NOT uploaded.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the \`16kb-audit-*\` log artifact for the failing libraries." >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build failed before the 16 KB gate ran — check buildozer log artifact**" >> $GITHUB_STEP_SUMMARY
        fi
